name: Deploy Kafla Server to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/kafla-server
            
            echo "[CI/CD] Pulling latest repository changes..."
            git pull origin main
            
            echo "[CI/CD] Pulling latest Docker image from Docker Hub..."
            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:latest
            docker pull $DOCKER_IMAGE
            
            echo "[CI/CD] Deploying updated container stack..."
            DOCKER_IMAGE=$DOCKER_IMAGE docker compose up -d --remove-orphans
            
            echo "[CI/CD] Running database migrations (Prisma migrate deploy)..."
            docker compose exec -T kafla-api npx prisma migrate deploy
            
            echo "[CI/CD] Pruning unused Docker images..."
            docker image prune -f
            
            echo "[CI/CD] Deployment to AWS EC2 completed successfully!"
