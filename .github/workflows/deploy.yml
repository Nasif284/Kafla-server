name: Deploy Kafla Server to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code for Compose Spec
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USER }}/kafla-server"

      - name: Execute Zero-Downtime Rollout on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/kafla-server
            
            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/kafla-api:latest
            
            echo "[CI/CD] Pulling latest production image from Docker Hub..."
            docker compose -f docker-compose.prod.yml pull kafla-api
            
            echo "[CI/CD] Deploying updated container stack..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "[CI/CD] Running database migrations (Prisma migrate deploy)..."
            docker compose -f docker-compose.prod.yml exec -T kafla-api npx prisma migrate deploy
            
            echo "[CI/CD] Pruning unused Docker images..."
            docker image prune -f
            
            echo "[CI/CD] Production deployment completed successfully!"
