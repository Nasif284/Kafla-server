services:
  kafla-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    environment:
      - .env
    command: sh -c 'npm run db:generate && npm run dev'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_started
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/var/lib/redis/data

volumes:
  redis_data:
