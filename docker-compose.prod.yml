services:
  kafla-api:
    image: ${DOCKER_IMAGE}
    container_name: kafla-api
    restart: always
    ports:
      - '127.0.0.1:5001:5001'
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - app-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  app-network:
    external: true

